<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="690" viewBox="0 0 1720 690" font-family="Calibri,Segoe UI,sans-serif">
<rect width="1720" height="690" fill="#fcfcfb"/>
<text x="40" y="36" font-size="21" font-weight="bold" fill="#1F3B57">The audit pipeline, as a process with gates</text>
<text x="40" y="58" font-size="13" fill="#52514e">Four lanes, two gates with numeric thresholds fixed in advance, and the evidence each one produced</text>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1F3B57"/></marker></defs>
<rect x="20" y="110" width="1680" height="96" fill="#f6f5f2" stroke="#e3e2dd"/>
<rect x="20" y="110" width="30" height="96" fill="#1F3B57"/>
<text x="35" y="158" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-weight="bold" transform="rotate(-90 35 158)">DESIGN</text>
<rect x="20" y="206" width="1680" height="96" fill="#ffffff" stroke="#e3e2dd"/>
<rect x="20" y="206" width="30" height="96" fill="#1F3B57"/>
<text x="35" y="254" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-weight="bold" transform="rotate(-90 35 254)">RUN</text>
<rect x="20" y="302" width="1680" height="96" fill="#f6f5f2" stroke="#e3e2dd"/>
<rect x="20" y="302" width="30" height="96" fill="#1F3B57"/>
<text x="35" y="350" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-weight="bold" transform="rotate(-90 35 350)">ANALYSE</text>
<rect x="20" y="398" width="1680" height="96" fill="#ffffff" stroke="#e3e2dd"/>
<rect x="20" y="398" width="30" height="96" fill="#1F3B57"/>
<text x="35" y="446" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-weight="bold" transform="rotate(-90 35 446)">DECIDE</text>
<rect x="40" y="128" width="150" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="115.0" y="150.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Write hypotheses</text>
<text x="115.0" y="165.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">and decision rule</text>
<rect x="210" y="128" width="120" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="270.0" y="150.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Hash the file</text>
<text x="270.0" y="165.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">(SHA-256)</text>
<rect x="350" y="128" width="130" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="415.0" y="150.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Build stimuli</text>
<text x="415.0" y="165.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">from the corpus</text>
<rect x="500" y="224" width="130" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="565.0" y="246.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Calibrate on</text>
<text x="565.0" y="261.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">dominance tasks</text>
<rect x="650" y="224" width="110" height="60" rx="30" fill="#EAF7F1" stroke="#1baf7a" stroke-width="2"/>
<text x="705.0" y="254.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">95% correct?</text>
<text x="705.0" y="300.0" font-size="10.5" fill="#52514e" text-anchor="middle">passed: llama 97.5%, qwen 96.2%</text>
<rect x="780" y="224" width="120" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="840.0" y="246.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Run every</text>
<text x="840.0" y="261.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">condition</text>
<rect x="920" y="224" width="130" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="985.0" y="246.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Parse answers,</text>
<text x="985.0" y="261.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">count failures</text>
<text x="985.0" y="300.0" font-size="10.5" fill="#52514e" text-anchor="middle">0 unparseable of 1960 prompts</text>
<rect x="1070" y="320" width="130" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="1135.0" y="342.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Fit each model</text>
<text x="1135.0" y="357.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">separately</text>
<rect x="1220" y="320" width="150" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="1295.0" y="342.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Test the models</text>
<text x="1295.0" y="357.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">against each other</text>
<text x="1295.0" y="396.0" font-size="10.5" fill="#52514e" text-anchor="middle">gap p = 2e-05</text>
<rect x="1390" y="416" width="130" height="60" rx="30" fill="#FBEFEF" stroke="#e34948" stroke-width="2"/>
<text x="1455.0" y="438.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Same sign in</text>
<text x="1455.0" y="453.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">both models?</text>
<text x="1455.0" y="492.0" font-size="10.5" fill="#e34948" text-anchor="middle" font-weight="bold">FAILED - one model each way</text>
<rect x="1540" y="416" width="120" height="60" rx="5" fill="#ffffff" stroke="#1F3B57" stroke-width="1.6"/>
<text x="1600.0" y="438.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Publish the</text>
<text x="1600.0" y="453.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle">failure</text>
<path d="M 190 158 L 207 158" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 330 158 L 347 158" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 480 158 L 490.0 158 L 490.0 254 L 497 254" fill="none" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 630 254 L 647 254" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 760 254 L 777 254" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 900 254 L 917 254" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 1050 254 L 1060.0 254 L 1060.0 350 L 1067 350" fill="none" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 1200 350 L 1217 350" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 1370 350 L 1380.0 350 L 1380.0 446 L 1387 446" fill="none" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 1520 446 L 1537 446" stroke="#1F3B57" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="20" y="520" width="1680" height="78" rx="6" fill="#FBEFEF" stroke="#e34948" stroke-width="1.5"/>
<text x="36.0" y="544.0" font-size="14" fill="#922B21" text-anchor="start" font-weight="bold">The last gate failed, and that is the output.</text>
<text x="36.0" y="566.0" font-size="11.5" fill="#922B21" text-anchor="start">The rule was fixed before the run: a result counts only if it has the same sign and is significant in both models. One model discounted the AI label, the other rewarded it, so nothing shipped.</text>
<text x="36.0" y="583.0" font-size="11.5" fill="#922B21" text-anchor="start">A pipeline whose gates can only pass is not a pipeline. The value here is that a gate written in advance stopped a result the analyst would otherwise have been pleased to report.</text>
<text x="40" y="676" font-size="11" fill="#8a8984">Generated from results/findings.json - the pass rates, parse counts and p-value under each box are read from the result files, not typed in.</text>
</svg>