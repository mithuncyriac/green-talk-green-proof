<text x="382.9" y="456.0" font-size="11" fill="#8a8984" text-anchor="middle">-10 pp</text>
<text x="515.2" y="456.0" font-size="11" fill="#8a8984" text-anchor="middle">-5 pp</text>
<text x="647.5" y="456.0" font-size="11" fill="#8a8984" text-anchor="middle">0</text>
