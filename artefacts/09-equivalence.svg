<text x="330.0" y="478.0" font-size="11.5" fill="#52514e" text-anchor="start">difference in the chance of choosing the product, specific claim minus vague claim</text>
<text x="40.0" y="550.0" font-size="11.5" fill="#8a8984" text-anchor="start">A non-significant difference is not evidence of equivalence. This is the test that is: two one-sided tests against a bound fixed before looking.</text>
<text x="40.0" y="566.0" font-size="11.5" fill="#8a8984" text-anchor="start">The bound matters. Five points is a quarter of the ~20-point lift the models show for having any green claim at all,</text>
<text x="40.0" y="582.0" font-size="11.5" fill="#8a8984" text-anchor="start">so equivalence within 5 points means the substantiation is worth little next to the claim.</text>
<text x="40.0" y="598.0" font-size="11.5" fill="#8a8984" text-anchor="start">Paired by task, both display orders. Generated from results/03_agent_audit_*.csv.</text>
