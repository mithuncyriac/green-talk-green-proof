<text x="426.1" y="328.0" font-size="12" fill="#52514e" text-anchor="middle">7</text>
<line x1="50.0" y1="311" x2="459.0" y2="311" stroke="#52514e"/>
<text x="254.5" y="346.0" font-size="11" fill="#8a8984" text-anchor="middle">rating given, unlabelled reviews</text>
<text x="50.0" y="368.0" font-size="11.5" fill="#52514e" text-anchor="start">50% of its unlabelled ratings are already at its own ceiling</text>
