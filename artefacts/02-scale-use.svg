<line x1="505.0" y1="311" x2="914.0" y2="311" stroke="#52514e"/>
<text x="709.5" y="346.0" font-size="11" fill="#8a8984" text-anchor="middle">rating given, unlabelled reviews</text>
<text x="505.0" y="368.0" font-size="11.5" fill="#52514e" text-anchor="start">49% of its unlabelled ratings are already at its own ceiling</text>
<text x="40" y="451" font-size="11" fill="#8a8984">Qwen 2.5 7B used all seven points, but 50% of its unlabelled answers sit at its ceiling, so it has room to fall and little room to rise.</text>
<text x="40" y="466" font-size="11" fill="#8a8984">Llama 3.1 8B never emitted 3 or 7 in 300 ratings, so those points are outside its vocabulary; its effect is a shift of mass between the 5 it does use.</text>
<text x="40" y="481" font-size="11" fill="#8a8984">Standardising within model keeps the gap significant (+0.26 SD, p=1e-05), which is why the headline survives. Anyone reading the raw</text>
<text x="40" y="496" font-size="11" fill="#8a8984">point difference as a preference, rather than as a shift in where each model parks its answers, is reading past this chart.</text>
</svg>