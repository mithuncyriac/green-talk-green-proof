<rect x="40" y="226" width="375.2" height="30" fill="#1baf7a"/>
<text x="407.2" y="247.0" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="bold">98.8% identical</text>
<text x="430.0" y="247.0" font-size="12" fill="#e34948" text-anchor="start" font-weight="bold">1.2% changed</text>
<text x="40.0" y="286.0" font-size="12" fill="#52514e" text-anchor="start">helpfulness ratings  (n=600)</text>
<rect x="40" y="292" width="380" height="30" fill="#1baf7a" opacity="0.15"/>
<rect x="40" y="292" width="367.3" height="30" fill="#1baf7a"/>
<text x="399.3" y="313.0" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="bold">96.7% identical</text>
<text x="430.0" y="313.0" font-size="12" fill="#e34948" text-anchor="start" font-weight="bold">3.3% changed</text>
<text x="530.0" y="104.0" font-size="14" fill="#1F3B57" text-anchor="start" font-weight="bold">Did the headline move?</text>
