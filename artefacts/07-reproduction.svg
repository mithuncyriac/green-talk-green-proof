<text x="40" y="36" font-size="21" font-weight="bold" fill="#1F3B57">The same audit, run again 23 days later</text>
<text x="40" y="58" font-size="13" fill="#52514e">Same stimuli file (hash checked), same models, same prompts, temperature 0, seed 1</text>
<text x="40.0" y="104.0" font-size="14" fill="#1F3B57" text-anchor="start" font-weight="bold">Did the same prompt get the same answer?</text>
<text x="40.0" y="122.0" font-size="11" fill="#52514e" text-anchor="start">every prompt matched on model, task, condition and display order</text>
